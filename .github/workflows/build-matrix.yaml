name: Build planspec binaries (reusable matrix)

# Reusable build matrix (the exact shape the release machinery runs): the
# publish-gate plus the five platform builds. Called on every release tag by
# release.yml, and callable on any ref by maintainers (workflow_dispatch) to
# rehearse a matrix without publishing anything — this workflow has NO release
# job, NO npm job and writes nothing outside its own run artifacts.

on:
  workflow_call:
    inputs:
      ref_name:
        description: Tag-shaped version ref to build and name assets with (e.g. planspec-v1.2.3)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref_name:
        description: Tag-shaped version ref to build and name assets with (e.g. planspec-v1.2.3)
        type: string
        required: true

# Least privilege: builds read the tree and upload run artifacts only.
permissions:
  contents: read

env:
  # The tag-shaped ref every job derives the version from. release.yml
  # passes github.ref_name; a dispatch passes the ref explicitly. The
  # publish-gate's tag-shape gate runs before any build consumes it.
  PLANSPEC_TAG: ${{ inputs.ref_name }}

jobs:
  publish-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Tag shape gate
        run: sh npm/scripts/gate-tag.sh "${PLANSPEC_TAG}"
      - name: Registry existence gate
        env:
          NPM_SCOPE: ${{ vars.NPM_SCOPE }}
        run: |
          set -euo pipefail
          ver="${PLANSPEC_TAG#planspec-v}"
          if [ -z "${NPM_SCOPE:-}" ]; then
            echo "publish-gate: vars.NPM_SCOPE is unset — the npm channel is not configured, no npm pin exists to break; publish-npm still fails closed below"
            exit 0
          fi
          sh npm/scripts/gate-registry.sh --pkg "@${NPM_SCOPE}/planspec" --version "${ver}"

  build-linux-x86_64:
    needs: publish-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # The crate's own floor: Cargo.toml declares rust-version 1.99 and
          # the payload ships no rust-toolchain.toml, so the matrix pins it.
          toolchain: "1.99.0"
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools dpkg-dev
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Package tarball
        run: |
          set -euo pipefail
          ver="${PLANSPEC_TAG#planspec-v}"
          bin="target/x86_64-unknown-linux-musl/release/planspec"
          pkg="planspec-${ver}-x86_64-unknown-linux-musl.tar.gz"
          tar -C "$(dirname "$bin")" -czf "$pkg" planspec
          sha256sum "$pkg" > "$pkg.sha256"
      - name: Package deb
        run: |
          set -euo pipefail
          ver="${PLANSPEC_TAG#planspec-v}"
          stage="deb-planspec"
          mkdir -p "$stage/DEBIAN" "$stage/usr/bin"
          cat > "$stage/DEBIAN/control" <<EOF
          Package: planspec
          Version: ${ver}
          Architecture: amd64
          Maintainer: planspec developers <publisher@planspec.invalid>
          Description: Workplane verifier
           Resolves the evidence cited by a work-decomposition spec against the git
           repository and reports its verdict in exit codes. Never writes a file.
          EOF
          install -m 755 target/x86_64-unknown-linux-musl/release/planspec "$stage/usr/bin/planspec"
          dpkg-deb --build "$stage" "planspec_${ver}_amd64.deb"
          sha256sum "planspec_${ver}_amd64.deb" > "planspec_${ver}_amd64.deb.sha256"
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: linux-x86_64
          path: |
            planspec-*.tar.gz
            planspec-*.tar.gz.sha256
            planspec_*.deb
            planspec_*.deb.sha256

  build-linux-aarch64:
    needs: publish-gate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - run: cargo build --release --target aarch64-unknown-linux-gnu
      - name: Package tarball
        run: |
          set -euo pipefail
          ver="${PLANSPEC_TAG#planspec-v}"
          bin="target/aarch64-unknown-linux-gnu/release/planspec"
          pkg="planspec-${ver}-aarch64-unknown-linux-gnu.tar.gz"
          tar -C "$(dirname "$bin")" -czf "$pkg" planspec
          sha256sum "$pkg" > "$pkg.sha256"
      - name: Package deb
        run: |
          set -euo pipefail
          ver="${PLANSPEC_TAG#planspec-v}"
          stage="deb-planspec"
          mkdir -p "$stage/DEBIAN" "$stage/usr/bin"
          cat > "$stage/DEBIAN/control" <<EOF
          Package: planspec
          Version: ${ver}
          Architecture: arm64
          Maintainer: planspec developers <publisher@planspec.invalid>
          Description: Workplane verifier
           Resolves the evidence cited by a work-decomposition spec against the git
           repository and reports its verdict in exit codes. Never writes a file.
          EOF
          install -m 755 target/aarch64-unknown-linux-gnu/release/planspec "$stage/usr/bin/planspec"
          dpkg-deb --build "$stage" "planspec_${ver}_arm64.deb"
          sha256sum "planspec_${ver}_arm64.deb" > "planspec_${ver}_arm64.deb.sha256"
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: linux-aarch64
          path: |
            planspec-*.tar.gz
            planspec-*.tar.gz.sha256
            planspec_*.deb
            planspec_*.deb.sha256

  build-macos-x86_64:
    needs: publish-gate
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: x86_64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - name: Package
        run: |
          set -euo pipefail
          ver="${PLANSPEC_TAG#planspec-v}"
          pkg="planspec-${ver}-x86_64-apple-darwin.tar.gz"
          tar -C target/x86_64-apple-darwin/release -czf "$pkg" planspec
          shasum -a 256 "$pkg" > "$pkg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: macos-x86_64
          path: planspec-*

  build-macos-aarch64:
    needs: publish-gate
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: aarch64-apple-darwin
      - run: cargo build --release --target aarch64-apple-darwin
      - name: Package
        run: |
          set -euo pipefail
          ver="${PLANSPEC_TAG#planspec-v}"
          pkg="planspec-${ver}-aarch64-apple-darwin.tar.gz"
          tar -C target/aarch64-apple-darwin/release -czf "$pkg" planspec
          shasum -a 256 "$pkg" > "$pkg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: macos-aarch64
          path: planspec-*

  build-windows-x86_64:
    needs: publish-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $ver = $env:PLANSPEC_TAG -replace '^planspec-v', ''
          $exe = "target/release/planspec.exe"
          $zip = "planspec-$ver-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path $exe -DestinationPath $zip
          # Portable sidecar shape — hash, two spaces, filename, LF — so the
          # asset passes `sha256sum -c` like every other platform's sidecar
          # (Set-Content would write CRLF without the filename: not verifiable).
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          # $PWD must be joined explicitly: .NET's current directory does not
          # follow PowerShell's provider location.
          [System.IO.File]::WriteAllText((Join-Path $PWD.Path "$zip.sha256"), "$hash  $zip`n")
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: windows-x86_64
          path: planspec-*

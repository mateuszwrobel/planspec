[package]
name = "planspec"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Workplane verifier: read-only posture checks over work-decomposition specs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
glob = "0.3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[lints.rust]
unused_imports = "deny"

[lints.clippy]
all = "deny"
